name: Seal build camunda-spin-dataformat-all

# Upstream builds and tests on Jenkins (Jenkinsfile + .ci/config); none of the
# GitHub workflows it ships build or test. This workflow mirrors the Jenkins
# release build (JDK 17, mvn install) for the Spin modules: it builds
# camunda-spin-dataformat-all (shaded jar) with everything it depends on and
# runs the unit tests of the whole Spin reactor (core, dataformat-json-jackson,
# dataformat-xml-dom, dataformat-xml-dom-jakarta, dataformat-all) plus the
# camunda-commons modules they depend on.
#
# -Dclirr.skip=true: the check-api-compatibility profile (clirr API diff against
# the previous minor release) is always active; it is an API gate, not a test.
# TZ=Europe/Berlin: the XML date-mapping tests expect a +02:00 offset.
#
# The dataformat-all jar shades jackson-core 2.15.2, whose non-blocking parser does
# not enforce StreamReadConstraints.maxNumberLength (CVE-2026-18401), and
# jackson-databind 2.15.2, which resolves the host name of every InetSocketAddress
# it deserializes (CVE-2026-54514) and whose PolymorphicTypeValidator does not
# validate the type parameters of generic type ids (CVE-2026-54512).
# .seal/install-sealed-deps.sh builds jackson-core 2.15.2 and jackson-databind 2.15.2
# with the sealed fixes (.seal/jackson-core/CVE-2026-18401.patch,
# .seal/jackson-databind/CVE-2026-*.patch) and installs them into the local Maven
# repository before the Spin build; .seal/verify-sealed-deps.sh checks the built
# dataformat-all jar. JDK 8 is set up ahead of JDK 17 because the sealed
# jackson-core and jackson-databind 2.15.2 were built and tested on JDK 8.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Surefire -Dtest selector; empty runs the full Spin suite'
        required: false
        default: ''

env:
  MAVEN_OPTS: -Xmx3g
  TZ: Europe/Berlin

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8 (builds the sealed jackson-core and jackson-databind 2.15.2)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9
      - name: Install sealed jackson-core 2.15.2 (CVE-2026-18401) and jackson-databind 2.15.2 (CVE-2026-54514, CVE-2026-54512)
        run: bash .seal/install-sealed-deps.sh
      - name: Build and test Spin (full suite)
        if: ${{ inputs.test-filter == '' }}
        run: mvn -B -V install -pl spin/dataformat-all,spin/dataformat-xml-dom-jakarta -am -Dclirr.skip=true
      - name: Build and run selected tests
        if: ${{ inputs.test-filter != '' }}
        env:
          FILTER: ${{ inputs.test-filter }}
        run: mvn -B -V install -pl spin/dataformat-all,spin/dataformat-xml-dom-jakarta -am -Dclirr.skip=true -Dtest="${FILTER// /,}" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
      - name: Verify the shaded jackson-core and jackson-databind in the dataformat-all jar carry the sealed fixes
        run: bash .seal/verify-sealed-deps.sh
      - name: Print test summary and skipped tests (with skip reasons from surefire or test source)
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, re
          import xml.etree.ElementTree as ET

          UNINFORMATIVE = re.compile(r'^\s*$|^got: ')


          def block_above(lines, idx):
              out, j = [], idx - 1
              while j >= 0:
                  s = lines[j].strip()
                  if not s or s.endswith('}') or (s.endswith(';') and not s.startswith(('*', '//'))):
                      break
                  out.insert(0, s)
                  j -= 1
              keep = []
              for s in out:
                  if re.match(r'@(Ignore|Disabled|Required\w*)\b', s):
                      keep.append(s)
                  elif s.startswith(('//', '*', '/*')) and s.strip('/* ') and '@author' not in s and not s.startswith('* @'):
                      keep.append(s.lstrip('/* ').rstrip())
              return keep


          def source_reason(src_root, cls, name):
              top = cls.split('$')[0]
              path = os.path.join(src_root, top.replace('.', '/') + '.java')
              if not os.path.exists(path):
                  return []
              lines = open(path, encoding='utf-8', errors='replace').read().split('\n')
              notes = []
              meth = re.sub(r'\[.*$', '', name or '')
              idx = next((i for i, l in enumerate(lines)
                          if re.search(r'\bvoid\s+' + re.escape(meth) + r'\s*\(', l)), None) if meth else None
              if idx is not None:
                  notes += block_above(lines, idx)
                  for l in lines[idx:idx + 40]:
                      if re.search(r'\b[Aa]ssume\w*\.\w+\(|\bassume(True|False|That)\(', l):
                          notes.append('assumption: ' + l.strip())
                          break
              simple = cls.split('.')[-1].split('$')[-1]
              cidx = next((i for i, l in enumerate(lines)
                           if re.search(r'\bclass\s+' + re.escape(simple) + r'\b', l)), None)
              if cidx is not None:
                  notes += ['class-level ' + n for n in block_above(lines, cidx) if n.startswith('@')]
              return notes


          t = f = e = s = 0
          for p in sorted(glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True)):
              module = p.split('/target/surefire-reports/')[0]
              src_root = os.path.join(module, 'src/test/java')
              r = ET.parse(p).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0))
              e += int(r.get('errors', 0)); s += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  sk = tc.find('skipped')
                  if sk is None:
                      continue
                  cls, name = tc.get('classname'), tc.get('name')
                  msg = (sk.get('message') or '').strip()
                  parts = []
                  if msg and not UNINFORMATIVE.match(msg):
                      parts.append('@Ignore/skip message: ' + msg)
                  src = source_reason(src_root, cls, name)
                  if src:
                      if all(n in ('@Ignore', 'class-level @Ignore') for n in src):
                          src = src + ['disabled upstream by a bare @Ignore (no reason text in source)']
                      parts.append('source: ' + ' | '.join(src))
                  if not parts:
                      parts.append('no reason recorded by surefire or in source annotations')
                  print(f"SKIPPED: {cls}.{name} -- {'; '.join(parts)}")
          for module in sorted({p.split('/target/surefire-reports/')[0] for p in glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True)}):
              mt = mf = me = ms = 0
              for p in glob.glob(module + '/target/surefire-reports/TEST-*.xml'):
                  r = ET.parse(p).getroot()
                  mt += int(r.get('tests', 0)); mf += int(r.get('failures', 0))
                  me += int(r.get('errors', 0)); ms += int(r.get('skipped', 0))
              print(f"MODULE {module}: tests={mt} passed={mt-mf-me-ms} failures={mf} errors={me} skipped={ms}")
          print(f"SUMMARY: tests={t} passed={t-f-e-s} failures={f} errors={e} skipped={s}")
          EOF
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camunda-spin-dataformat-all
          if-no-files-found: error
          path: spin/dataformat-all/target/camunda-spin-dataformat-all-7.23.0.jar
